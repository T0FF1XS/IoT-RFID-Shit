[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.3.1
    miguelbalboa/MFRC522@^1.4.12
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit SSD1306@^2.0.4

build_flags =
    -DCORE_DEBUG_LEVEL=1
